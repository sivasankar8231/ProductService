server:
  port: 8081

spring:
  application:
    name: config-client
  config:
    import: "optional:configserver:http://localhost:8888" # URL of the config server
  kafka:
    bootstrap-servers: localhost:9092 # Adjust if Kafka is running on a different port/host

  cloud:
    bus:
      enabled: true
    bootstrap-servers: localhost:9092,localhost:9093

  management:
    endpoints:
      web:
        exposure:
          include: health,info,env,beans,refresh
